  <rect x="86" y="132" width="40" height="4" fill="#3a8f78" class="glow"/>
  <rect x="150" y="132" width="6" height="10" fill="#7ee0c3" class="cursor"/>
  <rect x="70" y="160" width="130" height="8" fill="#132e29"/>

  <ellipse cx="130" cy="60" rx="90" ry="55" fill="#4fbfa0" opacity="0.12" class="glow"/>
  <rect x="220" y="60" width="6" height="70" fill="#3a5c54"/>
  <polygon points="180,60 260,60 235,20 205,20" fill="#7ee0c3" opacity="0.5" class="glow"/>
