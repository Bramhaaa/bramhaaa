<svg width="700" height="250" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .rain { animation: fall 1.6s linear infinite; }
      .rain2 { animation: fall 1.9s linear infinite; }
      .rain3 { animation: fall 1.3s linear infinite; }
      @keyframes fall {
        0% { transform: translateY(-40px); opacity: 0; }
        10% { opacity: 0.7; }
        90% { opacity: 0.7; }
        100% { transform: translateY(160px); opacity: 0; }
      }
      .glow { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.85; }
      }
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .steam { animation: rise 3.5s ease-in-out infinite; }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-10px); opacity: 0.9; }
        100% { transform: translateY(-20px); opacity: 0; }
      }
    </style>
  </defs>

  <rect width="700" height="250" fill="#0b1a17"/>

  <rect x="0" y="0" width="700" height="250" fill="#0f2420"/>

  <rect x="430" y="20" width="220" height="150" fill="#132e29" stroke="#3a5c54" stroke-width="4"/>
  <rect x="430" y="20" width="220" height="150" fill="none" stroke="#1d3d37" stroke-width="10"/>
  <line x1="540" y1="20" x2="540" y2="170" stroke="#1d3d37" stroke-width="4"/>
  <line x1="430" y1="95" x2="650" y2="95" stroke="#1d3d37" stroke-width="4"/>

  <rect x="480" y="45" width="8" height="40" fill="#3a6b62" class="rain"/>
  <rect x="510" y="30" width="8" height="35" fill="#2f5a52" class="rain2"/>
  <rect x="560" y="50" width="8" height="45" fill="#3a6b62" class="rain3"/>
  <rect x="600" y="35" width="8" height="30" fill="#2f5a52" class="rain"/>
  <rect x="460" y="110" width="8" height="35" fill="#2f5a52" class="rain2"/>
  <rect x="620" y="115" width="8" height="40" fill="#3a6b62" class="rain3"/>
  <rect x="580" y="125" width="8" height="30" fill="#2f5a52" class="rain"/>

  <rect x="440" y="185" width="200" height="8" fill="#173832"/>
