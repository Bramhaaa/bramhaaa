  <rect x="330" y="160" width="14" height="60" fill="#1d3d37"/>

  <rect x="70" y="90" width="130" height="70" fill="#173832"/>
  <rect x="78" y="98" width="114" height="54" fill="#0c2118"/>
  <rect x="82" y="102" width="106" height="46" fill="#0e3d33"/>
  <rect x="86" y="106" width="60" height="6" fill="#4fbfa0" class="glow"/>
  <rect x="86" y="116" width="90" height="4" fill="#3a8f78" class="glow"/>
